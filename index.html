<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Le user-scalable=no et le viewport-fit=cover sont vitaux pour l'effet App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TdB Sportif</title>
    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1c1d24;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-primary: #0a84ff;
            --accent-run: #ff453a;
            --accent-bike: #32ade6;
            --accent-roller: #30d158;
            --nav-bg: rgba(28, 29, 36, 0.9);
        }

        /* 1. Verrouillage du scroll global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* 100dvh garantit que la barre de nav mobile ne cache pas le bas */
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* 2. Architecture App (Header, Main, Nav) */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        main {
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* Pas de scroll ici, les vues gèrent leur espace */
        }

        /* 3. Système de Vues */
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            /* Si on a exceptionnellement besoin de scroller à l'intérieur d'une vue spécifique */
            overflow-y: auto; 
        }

        .view.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 4. Bento Grid Design */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: auto auto auto;
            gap: 15px;
            height: 100%;
        }

        .bento-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .bento-card:active {
            transform: scale(0.96);
        }

        .bento-large {
            grid-column: span 2;
        }

        .bento-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .bento-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        /* Couleurs dynamiques pour les cards */
        .run-val { color: var(--accent-run); }
        .bike-val { color: var(--accent-bike); }
        .roller-val { color: var(--accent-roller); }

        /* Barre de navigation inférieure */
        nav {
            height: 80px; /* Plus grand pour l'ergonomie mobile */
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 15px; /* Espace pour la barre d'accueil iOS/Android */
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s;
            width: 70px;
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-btn.active {
            color: var(--accent-primary);
        }

        /* 5. Modale Détail (Glissement depuis le bas) */
        #detail-modal {
            position: fixed;
            top: 100%; /* Caché en bas par défaut */
            left: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            z-index: 100;
            transition: top 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
        }

        #detail-modal.open {
            top: 0; /* Apparaît en recouvrant tout */
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--card-bg);
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-content {
            padding: 20px;
            flex-grow: 1;
            /* Le seul endroit où le scroll est toléré si le graph est très grand */
            overflow-y: auto; 
        }

        .placeholder-graph {
            height: 250px;
            background: linear-gradient(135deg, rgba(255,69,58,0.2) 0%, rgba(50,173,230,0.2) 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 1px dashed rgba(255,255,255,0.2);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header id="app-header">
        Dashboard Sportif
    </header>

    <main>
        <!-- Vue 1 : Dashboard Général (Bento Grid) -->
        <div id="view-home" class="view active">
            <div class="bento-grid">
                <!-- Tuile Large (Volume total) -->
                <div class="bento-card bento-large" onclick="openModal('Volume Annuel', 'Détails des distances cumulées par mois')">
                    <div class="bento-title">Volume 2026</div>
                    <div class="bento-value">1 245 <span style="font-size: 1rem; font-weight: normal; color: var(--text-muted);">km</span></div>
                </div>
                
                <!-- Tuiles 50/50 -->
                <div class="bento-card" onclick="openModal('Course à pied', 'Allures et historiques des 10km')">
                    <div class="bento-title">Course</div>
                    <div class="bento-value run-val">342<span style="font-size: 1rem;">km</span></div>
                </div>
                <div class="bento-card" onclick="openModal('Vélo & Vélotaf', 'Statistiques de tes trajets Lille-Lys')">
                    <div class="bento-title">Vélo</div>
                    <div class="bento-value bike-val">780<span style="font-size: 1rem;">km</span></div>
                </div>
                
                <!-- Tuile Large (Prochain Objectif) -->
                <div class="bento-card bento-large" style="background: linear-gradient(135deg, var(--card-bg) 0%, rgba(48, 209, 88, 0.1) 100%);">
                    <div class="bento-title">Roller Vitesse</div>
                    <div class="bento-value roller-val">Dernière Sortie: 24 km/h</div>
                </div>
            </div>
        </div>

        <!-- Vue 2 : Liste des séances -->
        <div id="view-activities" class="view">
            <h2 style="margin-bottom: 15px;">Dernières séances</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div class="bento-card" style="padding: 15px; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
                    <div>
                        <div class="bento-title">Course - 10km Ludopital</div>
                        <div style="font-weight: 600;">45:55</div>
                    </div>
                    <div class="run-val" style="font-weight: bold;">4'35/km</div>
                </div>
                <div class="bento-card" style="padding: 15px; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
                    <div>
                        <div class="bento-title">Vélotaf - Lys > Mairie</div>
                        <div style="font-weight: 600;">15.2 km</div>
                    </div>
                    <div class="bike-val" style="font-weight: bold;">32 min</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Navigation en bas -->
    <nav>
        <button class="nav-btn active" data-target="view-home">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            Accueil
        </button>
        <button class="nav-btn" data-target="view-activities">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Activités
        </button>
    </nav>

    <!-- Modale de détail -->
    <div id="detail-modal">
        <div class="modal-header">
            <h2 id="modal-title" style="font-size: 1.2rem;">Détail</h2>
            <button class="close-btn" onclick="closeModal()">Fermer</button>
        </div>
        <div class="modal-content">
            <p id="modal-desc" style="color: var(--text-muted);"></p>
            <div class="placeholder-graph">
                [Ici viendra ton graphique ou tableau détaillé]
            </div>
        </div>
    </div>

    <script>
        // Gestion de la navigation Bottom Tab Bar
        const navBtns = document.querySelectorAll('.nav-btn');
        const views = document.querySelectorAll('.view');
        const header = document.getElementById('app-header');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Retrait de la classe active sur tous les boutons et vues
                navBtns.forEach(b => b.classList.remove('active'));
                views.forEach(v => v.classList.remove('active'));
                
                // Activation du bouton cliqué et de sa vue cible
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');

                // Changement de titre dynamique
                if(targetId === 'view-home') header.innerText = 'Dashboard Sportif';
                if(targetId === 'view-activities') header.innerText = 'Historique FIT/CSV';
            });
        });

        // Gestion de la Modale détaillée
        const modal = document.getElementById('detail-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        function openModal(title, desc) {
            modalTitle.innerText = title;
            modalDesc.innerText = desc;
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
        }
    </script>
</body>
</html>
