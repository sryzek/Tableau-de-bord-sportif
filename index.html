<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f1014">
    <title>TdB Sportif</title>
    
    <!-- Librairies de l'ancien moteur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.9.0/dist/fit-parser.js"></script>

    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1c1d24;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent-primary: #0a84ff;
            --accent-run: #ff453a;
            --accent-bike: #32ade6;
            --accent-roller: #30d158;
            --nav-bg: rgba(28, 29, 36, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100dvh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* HEADER AVEC BOUTON IMPORT */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .header-action {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        main {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .view.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* BENTO GRID */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .bento-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .bento-card:active {
            transform: scale(0.96);
        }

        .bento-large { grid-column: span 2; }
        
        .bento-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bento-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .run-val { color: var(--accent-run); }
        .bike-val { color: var(--accent-bike); }
        .roller-val { color: var(--accent-roller); }

        /* LISTE ACTIVITES */
        .activities-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .activities-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 20px;
            flex-grow: 1;
        }

        .activity-item {
            padding: 15px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 80px;
            background-color: var(--card-bg);
            border-radius: 15px;
            cursor: pointer;
        }
        
        .activity-item:active { transform: scale(0.98); }

        /* NAV */
        nav {
            height: 80px;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s;
            width: 70px;
        }

        .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-btn.active { color: var(--accent-primary); }

        /* MODALE */
        #detail-modal {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            z-index: 100;
            transition: top 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
        }

        #detail-modal.open { top: 0; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto; 
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .detail-kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-kpi {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        .dkpi-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .dkpi-val { font-size: 1.2rem; font-weight: bold; }

        .chart-wrapper {
            height: 250px;
            width: 100%;
            background: rgba(255,255,255,0.02);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="header-title">Dashboard Sportif</div>
        <input type="file" id="mainFileInput" accept=".csv, .fit" style="display:none;" onchange="processFiles(event)" multiple>
        <button class="header-action" onclick="document.getElementById('mainFileInput').click()">
            📥 Import
        </button>
    </header>

    <main>
        <!-- VUE 1 : BENTO GRID -->
        <div id="view-home" class="view active">
            <div class="bento-grid">
                <!-- Volume total de l'année -->
                <div class="bento-card bento-large">
                    <div class="bento-title" id="bento-vol-title">Volume Total</div>
                    <div class="bento-value" id="bento-vol-val">0 <span style="font-size: 1rem; color: var(--text-muted);">km</span></div>
                </div>
                
                <!-- Course -->
                <div class="bento-card">
                    <div class="bento-title">Course</div>
                    <div class="bento-value run-val" id="bento-run-val">0<span style="font-size: 1rem;">km</span></div>
                </div>
                
                <!-- Vélo -->
                <div class="bento-card">
                    <div class="bento-title">Vélo</div>
                    <div class="bento-value bike-val" id="bento-bike-val">0<span style="font-size: 1rem;">km</span></div>
                </div>
                
                <!-- Roller Vitesse (Dernière sortie) -->
                <div class="bento-card bento-large" style="background: linear-gradient(135deg, var(--card-bg) 0%, rgba(48, 209, 88, 0.1) 100%);">
                    <div class="bento-title">Roller Vitesse</div>
                    <div class="bento-value roller-val" id="bento-roller-val">Aucune donnée</div>
                </div>
            </div>
        </div>

        <!-- VUE 2 : LISTE DES SEANCES -->
        <div id="view-activities" class="view">
            <div class="activities-container">
                <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Historique Complet</h2>
                <div class="activities-list" id="activitiesListContainer">
                    <!-- Généré dynamiquement par JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- NAVIGATION BOTTOM BAR -->
    <nav>
        <button class="nav-btn active" data-target="view-home">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            Accueil
        </button>
        <button class="nav-btn" data-target="view-activities">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Activités
        </button>
    </nav>

    <!-- MODALE DE DETAIL -->
    <div id="detail-modal">
        <div class="modal-header">
            <div>
                <h2 id="modal-title" style="font-size: 1.2rem; margin-bottom: 4px;">Titre</h2>
                <div id="modal-subtitle" style="font-size: 0.85rem; color: var(--text-muted);">Date - Sport</div>
            </div>
            <button class="close-btn" onclick="closeModal()">Fermer</button>
        </div>
        <div class="modal-content">
            <div class="detail-kpi-grid">
                <div class="detail-kpi"><span class="dkpi-lbl">Distance</span><span class="dkpi-val" id="mdl-dist">-</span></div>
                <div class="detail-kpi"><span class="dkpi-lbl">Durée</span><span class="dkpi-val" id="mdl-time">-</span></div>
                <div class="detail-kpi"><span class="dkpi-lbl" id="lbl-mdl-speed">Vitesse Moy</span><span class="dkpi-val" id="mdl-speed">-</span></div>
                <div class="detail-kpi"><span class="dkpi-lbl">FC Moyenne</span><span class="dkpi-val" id="mdl-fcmoy">-</span></div>
            </div>
            
            <div style="font-size: 0.9rem; margin-bottom: 10px; font-weight: bold;">Analyse Graphique</div>
            <div class="chart-wrapper">
                <canvas id="modalChartCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- INITIALISATION UI NATIVE ---
        const navBtns = document.querySelectorAll('.nav-btn');
        const views = document.querySelectorAll('.view');
        const headerTitle = document.querySelector('.header-title');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                views.forEach(v => v.classList.remove('active'));
                
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');

                if(targetId === 'view-home') headerTitle.innerText = 'Dashboard Sportif';
                if(targetId === 'view-activities') headerTitle.innerText = 'Historique des Séances';
            });
        });

        // --- MOTEUR DE DONNÉES (Adapté de ton ancienne version) ---
        Chart.register(ChartDataLabels);
        let chartInstance = null;
        let allRawActivities = [];
        const STORAGE_KEY = 'garmin_dashboard_data_v10'; // Récupération directe de tes anciennes données
        let currentOpenedActivityUid = null;

        document.addEventListener("DOMContentLoaded", () => { 
            loadDataFromStorage();
        });

        function loadDataFromStorage() {
            let saved = localStorage.getItem(STORAGE_KEY);
            if(saved) {
                try {
                    allRawActivities = JSON.parse(saved);
                    buildDashboard();
                } catch(e) { console.error("Erreur lecture cache", e); }
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(allRawActivities));
            } catch(e) {
                alert("Mémoire pleine. Impossible de sauvegarder en local.");
            }
        }

        function generateUid(row) {
            let rawDate = row["Date"] || "nodate";
            let rawTitle = row["Titre"] || "notitle";
            let str = rawDate + "_" + rawTitle;
            return btoa(encodeURIComponent(str)).replace(/=/g, ''); 
        }

        // --- PARSING FICHIERS (CSV & FIT) ---
        async function processFiles(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            let countAdded = 0;
            
            for(let i=0; i<files.length; i++) {
                let file = files[i];
                let ext = file.name.split('.').pop().toLowerCase();
                
                if (ext === 'csv') {
                    await new Promise((resolve) => {
                        Papa.parse(file, { 
                            header: true, skipEmptyLines: true, 
                            complete: function(results) { 
                                countAdded += mergeRawData(results.data); 
                                resolve();
                            } 
                        });
                    });
                } else if (ext === 'fit') {
                    if (typeof FitParser === 'undefined') {
                        alert("Le lecteur FIT n'est pas chargé.");
                        continue;
                    }
                    await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const fitParser = new FitParser({ forceSetUnit: true, lengthUnit: 'km', speedUnit: 'km/h' });
                            fitParser.parse(e.target.result, function(err, data) {
                                if(!err && data.sessions && data.sessions.length > 0) {
                                    if(addFitToActivities(data, file.name)) countAdded++;
                                }
                                resolve();
                            });
                        };
                        reader.readAsArrayBuffer(file);
                    });
                }
            }
            event.target.value = '';
            
            if (countAdded > 0) {
                allRawActivities.sort((a, b) => {
                    if (!a.isoDate) return 1; if (!b.isoDate) return -1;
                    return b.isoDate.localeCompare(a.isoDate);
                });
                saveToStorage();
                buildDashboard();
                alert("Import réussi ! " + countAdded + " nouvelle(s) activité(s).");
            }
        }

        function mergeRawData(rows) {
            let countAdded = 0;
            rows.forEach((row) => {
                let sportName = row["Type d'activité"] || row["Activité"] || row["Type"];
                if (!sportName) return;
                let uid = generateUid(row);
                
                let exists = allRawActivities.find(a => a.uid === uid);
                if (!exists) {
                    let sportLower = sportName.toLowerCase();
                    if (sportLower === "autre" || sportLower === "roller") sportName = "Roller / Autre";
                    let isoDate = extractDateString(row["Date"]);
                    let dist = parseNumber(row["Distance"]);
                    let durationStr = row["Durée"] || row["Temps écoulé"];
                    let durationSec = parseDuration(durationStr);
                    let elev = parseNumber(row["Ascension totale"]);
                    let fcmoy = parseNumber(row["Fréquence cardiaque moyenne"]);
                    
                    let speed = 0;
                    let allureRaw = row["Allure moyenne"];
                    let vitesseRaw = row["Vitesse moyenne"];
                    
                    if (allureRaw && allureRaw !== '--') {
                        let paceSec = parseDuration(allureRaw);
                        if (paceSec > 0) speed = 3600 / paceSec;
                    } else if (vitesseRaw && vitesseRaw !== '--') {
                        if (String(vitesseRaw).includes(':')) {
                            let paceSec = parseDuration(vitesseRaw);
                            if (paceSec > 0) speed = 3600 / paceSec;
                        } else {
                            speed = parseNumber(vitesseRaw);
                        }
                    }
                    if (speed === 0 && dist > 0 && durationSec > 0) speed = dist / (durationSec / 3600);
                    
                    allRawActivities.push({
                        uid: uid, originalDate: row["Date"], isoDate: isoDate, title: row["Titre"],
                        sport: sportName, distance: dist, durationFormatted: durationStr || "--", 
                        durationSec: durationSec, speed: speed, elevation: elev, hr: fcmoy,
                        raw: row, savedIntervals: null
                    });
                    countAdded++;
                }
            });
            return countAdded;
        }

        function addFitToActivities(data, filename) {
            let sess = data.sessions[0];
            if (!sess) return false;
            let dObj = new Date(sess.start_time);
            let isoDate = dObj.toISOString().split('T')[0];
            let timeStr = dObj.toTimeString().split(' ')[0];
            
            let sportMap = { 'running': 'Course à pied', 'cycling': 'Cyclisme sur route', 'inline_skating': 'Roller / Autre' };
            let sportName = sportMap[sess.sport] || sess.sport || 'Autre';
            
            let title = `${sportName} (FIT)`;
            let uid = btoa(encodeURIComponent(isoDate + "_" + timeStr + "_" + sportName)).replace(/=/g, '');
            if (allRawActivities.find(a => a.uid === uid)) return false;
            
            let dist = parseFloat(sess.total_distance) || 0; 
            let durationSec = parseFloat(sess.total_elapsed_time) || 0;
            let speed = parseFloat(sess.avg_speed) || 0; 
            let elev = parseFloat(sess.total_ascent) || 0;
            let hr = parseFloat(sess.avg_heart_rate) || 0;
            
            let durationFormatted = formatDuration(durationSec);
            let intervals = (data.laps && data.laps.length > 0) ? buildIntervalsFromFit(data.laps) : null;
            
            allRawActivities.push({
                uid: uid, originalDate: `${isoDate} ${timeStr}`, isoDate: isoDate, title: title,
                sport: sportName, distance: dist, durationFormatted: durationFormatted,
                durationSec: durationSec, speed: speed, elevation: elev, hr: hr,
                raw: {}, savedIntervals: intervals
            });
            return true;
        }

        function buildIntervalsFromFit(laps) {
            let intervals = [];
            laps.forEach((lap, idx) => {
                let dist = parseFloat(lap.total_distance) || 0;
                let sec = parseFloat(lap.total_timer_time || lap.total_elapsed_time) || 0;
                let speed = parseFloat(lap.avg_speed) || 0;
                if(dist <= 0 && sec <= 0) return;
                intervals.push({
                    label: `T${idx+1}`, dist: dist, sec: sec,
                    paceSec: speed > 0 ? 3600/speed : 0, speedKmh: speed,
                    compactTime: formatCompactTime(sec)
                });
            });
            return intervals;
        }

        // --- UTILITAIRES ---
        function parseNumber(val) {
            if (!val || val === '--') return 0;
            let str = String(val).trim().replace(/\s/g, '').replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }
        function parseDuration(val) {
            if (!val || val === '--') return 0;
            let p = String(val).split(':');
            if(p.length === 3) return (+p[0])*3600 + (+p[1])*60 + (+p[2]);
            if(p.length === 2) return (+p[0])*60 + (+p[1]);
            return parseFloat(p[0]) || 0;
        }
        function formatDuration(sec) {
            let h = Math.floor(sec / 3600); let m = Math.floor((sec % 3600) / 60); let s = Math.round(sec % 60);
            if (s === 60) { s = 0; m += 1; } if (m === 60) { m = 0; h += 1; }
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        function formatPace(secPerKm) {
            if (!secPerKm || secPerKm <= 0) return "--";
            let m = Math.floor(secPerKm / 60); let s = Math.round(secPerKm % 60);
            if (s === 60) { s = 0; m += 1; }
            return m + ":" + s.toString().padStart(2, '0');
        }
        function formatCompactTime(totalSec) { 
            let m = Math.floor(totalSec / 60); let s = Math.round(totalSec % 60);
            return m > 0 ? m + "'" + s.toString().padStart(2, '0') + '"' : s + '"'; 
        }
        function extractDateString(str) {
            if (!str || str === '--') return null;
            let d = str.split(' ')[0].trim(); 
            if (d.includes('/')) {
                let p = d.split('/');
                if (p[2] && p[2].length === 4) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
            }
            return d;
        }
        function formatFrenchDate(iso) {
            if (!iso) return "-";
            const p = iso.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
        }

        // --- MISE A JOUR UI (LIAISON DONNEES -> BENTO) ---
        function buildDashboard() {
            updateBentoGrid();
            updateActivitiesList();
        }

        function updateBentoGrid() {
            let totalDist = 0, runDist = 0, bikeDist = 0;
            let latestRoller = null;
            let currentYear = new Date().getFullYear().toString();
            
            document.getElementById('bento-vol-title').innerText = `Volume ${currentYear}`;

            allRawActivities.forEach(act => {
                // Filtre sur l'année en cours pour le global (ou toutes si pas de date)
                if(act.isoDate && act.isoDate.startsWith(currentYear)) {
                    totalDist += act.distance;
                }
                
                let s = act.sport.toLowerCase();
                if(s.includes('course') || s.includes('run')) runDist += act.distance;
                if(s.includes('cyclisme') || s.includes('vélo')) bikeDist += act.distance;
                
                if(s.includes('roller')) {
                    if(!latestRoller || (act.isoDate && act.isoDate > latestRoller.isoDate)) {
                        latestRoller = act;
                    }
                }
            });

            document.getElementById('bento-vol-val').innerHTML = `${Math.round(totalDist)} <span style="font-size: 1rem; color: var(--text-muted);">km</span>`;
            document.getElementById('bento-run-val').innerHTML = `${Math.round(runDist)}<span style="font-size: 1rem;">km</span>`;
            document.getElementById('bento-bike-val').innerHTML = `${Math.round(bikeDist)}<span style="font-size: 1rem;">km</span>`;

            if(latestRoller && latestRoller.speed > 0) {
                document.getElementById('bento-roller-val').innerHTML = `${latestRoller.speed.toFixed(1)} <span style="font-size:1rem;">km/h</span>`;
            }
        }

        function updateActivitiesList() {
            const container = document.getElementById('activitiesListContainer');
            container.innerHTML = '';
            
            let sorted = [...allRawActivities].sort((a,b) => b.isoDate.localeCompare(a.isoDate));
            
            sorted.forEach(act => {
                let s = act.sport.toLowerCase();
                let colorClass = 'text-main';
                let isPace = false;
                
                if(s.includes('course') || s.includes('marche')) { colorClass = 'run-val'; isPace = true; }
                else if(s.includes('cyclisme') || s.includes('vélo')) { colorClass = 'bike-val'; }
                else if(s.includes('roller')) { colorClass = 'roller-val'; }

                let perfStr = isPace && act.speed > 0 ? formatPace(3600/act.speed) + "/km" : act.speed.toFixed(1) + " km/h";

                let div = document.createElement('div');
                div.className = 'activity-item';
                div.onclick = () => openActivityModal(act.uid);
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: space-between;">
                        <div class="bento-title">${formatFrenchDate(act.isoDate)} - ${act.sport}</div>
                        <div style="font-weight: 600; font-size: 1.1rem; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${act.title}</div>
                        <div style="font-size: 0.9rem; color: var(--text-muted);">${act.distance.toFixed(2)} km en ${act.durationFormatted}</div>
                    </div>
                    <div class="${colorClass}" style="font-weight: bold; font-size: 1.1rem; text-align: right;">
                        ${perfStr}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- GESTION MODALE & GRAPHIQUE ---
        const modal = document.getElementById('detail-modal');

        function openActivityModal(uid) {
            let act = allRawActivities.find(a => a.uid === uid);
            if (!act) return;

            let isPaceBased = (act.sport.toLowerCase().includes('course') || act.sport.toLowerCase().includes('marche'));

            document.getElementById('modal-title').innerText = act.title;
            document.getElementById('modal-subtitle').innerText = `${formatFrenchDate(act.isoDate)} — ${act.sport}`;
            
            document.getElementById('mdl-dist').innerText = `${act.distance.toFixed(2)} km`;
            document.getElementById('mdl-time').innerText = act.durationFormatted;
            
            document.getElementById('lbl-mdl-speed').innerText = isPaceBased ? 'Allure Moy' : 'Vitesse Moy';
            document.getElementById('mdl-speed').innerText = act.speed > 0 
                ? (isPaceBased ? formatPace(3600/act.speed) + ' /km' : act.speed.toFixed(1) + ' km/h') 
                : '--';
                
            document.getElementById('mdl-fcmoy').innerText = act.hr > 0 ? `${act.hr} bpm` : '--';

            // Tracer le graph si on a des intervalles
            if(chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('modalChartCanvas').getContext('2d');

            if(act.savedIntervals && act.savedIntervals.length > 0) {
                let labels = act.savedIntervals.map(i => i.label);
                let data = act.savedIntervals.map(i => isPaceBased ? i.paceSec : i.speedKmh);
                
                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: labels, datasets: [{ data: data, backgroundColor: '#0a84ff', borderRadius: 4 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: {display:false}, datalabels: {display:false} },
                        scales: { x: {display:true}, y: {display:false, reverse: isPaceBased} }
                    }
                });
            } else {
                // Pas d'intervalle : on trace juste une ligne fictive d'illustration
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: ['Début', 'Milieu', 'Fin'], datasets: [{ data: [act.speed*0.9, act.speed*1.1, act.speed], borderColor: '#30d158', tension: 0.4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend:{display:false}, datalabels:{display:false} }, scales: {x:{display:false}, y:{display:false}} }
                });
            }

            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
        }
    </script>
</body>
</html>
