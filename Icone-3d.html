<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur Icône Relief</title>
</head>
<body style="background:#2c3e50; color:white; text-align:center; padding:30px; font-family:sans-serif;">
  
  <h3>Maintiens ton doigt sur l'icône ci-dessous pour l'enregistrer</h3>
  <p style="font-size:12px; color:#9aa3af;">Le fichier généré sera un PNG transparent de 512x512 px.</p>
  
  <img id="result" style="border-radius:22%; box-shadow:0 15px 35px rgba(0,0,0,0.5); width:256px; height:256px; margin-top:20px;" />
  
  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 512; 
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // 1. Fond avec dégradé diagonal (lumière en haut à gauche, ombre en bas à droite)
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#ff6b5a'); // Rouge lumineux
    grad.addColorStop(1, '#b03328'); // Rouge très sombre
    
    // Forme de base (carré aux bords très légèrement arrondis pour le tracé interne)
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);
    
    // 2. Effet biseauté (lumière en haut, ombre en bas)
    ctx.lineWidth = 12;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; // Reflet
    ctx.beginPath(); ctx.moveTo(0, 512); ctx.lineTo(0, 0); ctx.lineTo(512, 0); ctx.stroke();
    
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; // Ombre
    ctx.beginPath(); ctx.moveTo(512, 0); ctx.lineTo(512, 512); ctx.lineTo(0, 512); ctx.stroke();

    // 3. Ombre portée très marquée sous la courbe (Relief de l'élément central)
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetX = 8;
    ctx.shadowOffsetY = 12;
    
    // 4. Tracé de la courbe (Activité Garmin)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 42;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(85, 280);
    ctx.lineTo(165, 280);
    ctx.lineTo(256, 120); // Pic d'effort
    ctx.lineTo(340, 390); // Descente
    ctx.lineTo(410, 280);
    ctx.lineTo(435, 280);
    ctx.stroke();

    // Rendu de l'image dans la balise img pour permettre l'appui long sur tablette
    document.getElementById('result').src = canvas.toDataURL('image/png');
  </script>
</body>
</html>
